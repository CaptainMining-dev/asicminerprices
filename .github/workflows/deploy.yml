name: Build & Deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6h (données live fraîches)
  workflow_dispatch:          # bouton "Run" manuel dans GitHub
  push:
    branches: [main]          # à chaque modif du code

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data (mempool.space, 2miners, blockchair, coingecko)
        run: python3 fetch_data.py || echo "::warning::fetch failed — fallback snapshot constants will be used"

      - name: Build static site
        run: python3 build.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=asicminerprices --branch=main
